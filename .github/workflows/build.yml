# Windows 用のインストーラー（.exe）と Mac 用のアプリ（.dmg）を作る
# - main に push したとき：両方作って確かめ、成果物（Artifacts）に置く
# - 自動リリース：package.json の版番号（例 0.1.0）のリリース v0.1.0 がまだ無ければ、
#   Mac 版を runway で Developer ID 署名・公証し、全部そろったらリリースを作って .exe と .dmg を置く
#   → 新しい版を出すときは、版番号を上げて main に push するだけ
# - 自動更新：Secrets に TAURI_SIGNING_PRIVATE_KEY があれば、更新用のファイル（署名つき）と latest.json もリリースに置く
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # この push でリリースを出すかを決める
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      signing: ${{ steps.v.outputs.signing }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$UPDATER_KEY" ]; then echo "signing=true" >> "$GITHUB_OUTPUT"; else echo "signing=false" >> "$GITHUB_OUTPUT"; echo "::warning::TAURI_SIGNING_PRIVATE_KEY が無いので、自動更新のファイルは作らない"; fi
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag はもう出ている"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag はまだ無いので出す"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust を用意
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: 画面の部品を入れる
        run: npm ci

      - name: 中身の試験
        run: cargo test -p vaultsweep-core

      - name: MCP 用の小さなプログラムを作る
        shell: bash
        run: |
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp
          mkdir -p src-tauri/binaries
          cp target/release/vaultsweep-mcp.exe src-tauri/binaries/vaultsweep-mcp-x86_64-pc-windows-msvc.exe

      - name: アプリとインストーラーを作る
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: vaultsweep-windows
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error


  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust を用意（Apple シリコンと Intel の両方）
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 画面の部品を入れる
        run: npm ci

      - name: 中身の試験
        run: cargo test -p vaultsweep-core

      - name: MCP 用の小さなプログラムを作る（両方入りの1本にまとめる）
        run: |
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target aarch64-apple-darwin
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          lipo -create -output src-tauri/binaries/vaultsweep-mcp-universal-apple-darwin \
            target/aarch64-apple-darwin/release/vaultsweep-mcp target/x86_64-apple-darwin/release/vaultsweep-mcp
          # 両方入りを作るときも、途中でそれぞれの種類の名前で探されるので置いておく
          cp target/aarch64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-x86_64-apple-darwin

      - name: アプリと .dmg を作る（署名は仮の署名。Apple の公証はまだしない）
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 作ったアプリの中身を確かめる
        run: |
          APP=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          lipo -archs "$APP/Contents/MacOS/vaultsweep"
          lipo -archs "$APP/Contents/MacOS/vaultsweep-mcp"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | "$APP/Contents/MacOS/vaultsweep-mcp" | head -c 300

      - uses: actions/upload-artifact@v7
        with:
          name: vaultsweep-mac
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error


  # リリースのとき：runway の仕組みで Developer ID 署名 → 公証 → .dmg（kajisho5/runway の mac-notarize.yml）
  mac-notarized:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: kajisho5/runway/.github/workflows/mac-notarize.yml@main
    with:
      name: vaultsweep
      package: dmg
      app_link: true
      source_ref: ${{ github.sha }}
      version: ${{ needs.plan.outputs.version }}
      build: >-
        rustup toolchain install stable --profile minimal && rustup default stable
        && rustup target add aarch64-apple-darwin x86_64-apple-darwin
        && npm ci
        && cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target aarch64-apple-darwin
        && cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target x86_64-apple-darwin
        && mkdir -p src-tauri/binaries
        && lipo -create -output src-tauri/binaries/vaultsweep-mcp-universal-apple-darwin target/aarch64-apple-darwin/release/vaultsweep-mcp target/x86_64-apple-darwin/release/vaultsweep-mcp
        && cp target/aarch64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-aarch64-apple-darwin
        && cp target/x86_64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-x86_64-apple-darwin
        && npx tauri build --target universal-apple-darwin --bundles app
      products: |
        target/universal-apple-darwin/release/bundle/macos/vaultsweep.app
    secrets: inherit

  # 自動更新用：公証済みの dmg からアプリを取り出し、まとめる（.app.tar.gz）
  mac-updater:
    needs: [plan, mac-notarized]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.signing == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vaultsweep-notarized
          path: notarized
      - name: アプリを取り出して固める
        env:
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dmg=$(ls notarized/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          mkdir -p out work
          ditto "$mnt/vaultsweep.app" work/vaultsweep.app
          hdiutil detach "$mnt"
          # 公証の札をアプリにも付ける（失敗しても先へ。オンラインでの確認は効く）
          for n in 1 2 3; do xcrun stapler staple work/vaultsweep.app && break; sleep $((n * 10)); done || true
          codesign --verify --deep --strict --verbose=2 work/vaultsweep.app
          COPYFILE_DISABLE=1 tar -czf "out/vaultsweep_${VER}_universal.app.tar.gz" -C work vaultsweep.app
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: vaultsweep-updater-mac
          path: out/*.app.tar.gz
          if-no-files-found: error

  # 全部そろったらリリースを作って置く（どれか失敗したらリリースは作らない）
  publish:
    needs: [plan, windows, mac, mac-notarized, mac-updater]
    # mac-updater は鍵が無いと飛ばされる。そのときもリリースは作る
    if: always() && needs.plan.outputs.release == 'true' && needs.windows.result == 'success' && needs.mac.result == 'success' && needs.mac-notarized.result == 'success' && (needs.mac-updater.result == 'success' || needs.mac-updater.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vaultsweep-windows
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: vaultsweep-notarized
          path: out
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.signing == 'true'
        with:
          name: vaultsweep-updater-mac
          path: out
      - uses: actions/setup-node@v7
        if: needs.plan.outputs.signing == 'true'
        with:
          node-version: 22
      - name: 自動更新のファイルに署名して latest.json を作る
        if: needs.plan.outputs.signing == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TAG: ${{ needs.plan.outputs.tag }}
          VER: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          exe=$(ls out/*.exe | head -1); tgz=$(ls out/*.app.tar.gz | head -1)
          for f in "$exe" "$tgz"; do npx --yes @tauri-apps/cli@2.12.4 signer sign "$f"; done
          base="https://github.com/$REPO/releases/download/$TAG"
          jq -n --arg v "$VER" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wu "$base/$(basename "$exe")" --rawfile ws "$exe.sig" \
            --arg mu "$base/$(basename "$tgz")" --rawfile ms "$tgz.sig" \
            --arg notes "https://github.com/$REPO/releases/tag/$TAG" \
            '{version: $v, notes: $notes, pub_date: $d, platforms: {
               "windows-x86_64": {url: $wu, signature: ($ws|rtrimstr("\n"))},
               "darwin-aarch64": {url: $mu, signature: ($ms|rtrimstr("\n"))},
               "darwin-x86_64": {url: $mu, signature: ($ms|rtrimstr("\n"))}}}' > out/latest.json
          cat out/latest.json
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ls -la out
          files=(out/*.exe out/*.dmg)
          [ -f out/latest.json ] && files+=(out/*.app.tar.gz out/latest.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
