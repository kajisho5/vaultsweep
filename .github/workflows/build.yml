# Windows 用のインストーラー（.exe）と Mac 用のアプリ（.dmg）を作る
# - main に push したとき・手動で動かしたとき：成果物（Artifacts）に置く
# - v から始まるタグ（例 v0.1.0）を push したとき：リリースにも置く
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust を用意
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: 画面の部品を入れる
        run: npm ci

      - name: 中身の試験
        run: cargo test -p vaultsweep-core

      - name: MCP 用の小さなプログラムを作る
        shell: bash
        run: |
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp
          mkdir -p src-tauri/binaries
          cp target/release/vaultsweep-mcp.exe src-tauri/binaries/vaultsweep-mcp-x86_64-pc-windows-msvc.exe

      - name: アプリとインストーラーを作る
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: vaultsweep-windows
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: リリースに置く（タグのときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mac 側が先にリリースを作っていることもあるので、なければ作ってから置く
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/nsis/*.exe --clobber

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust を用意（Apple シリコンと Intel の両方）
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 画面の部品を入れる
        run: npm ci

      - name: 中身の試験
        run: cargo test -p vaultsweep-core

      - name: MCP 用の小さなプログラムを作る（両方入りの1本にまとめる）
        run: |
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target aarch64-apple-darwin
          cargo build --release -p vaultsweep-core --bin vaultsweep-mcp --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          lipo -create -output src-tauri/binaries/vaultsweep-mcp-universal-apple-darwin \
            target/aarch64-apple-darwin/release/vaultsweep-mcp target/x86_64-apple-darwin/release/vaultsweep-mcp
          # 両方入りを作るときも、途中でそれぞれの種類の名前で探されるので置いておく
          cp target/aarch64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/vaultsweep-mcp src-tauri/binaries/vaultsweep-mcp-x86_64-apple-darwin

      - name: アプリと .dmg を作る（署名は仮の署名。Apple の公証はまだしない）
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 作ったアプリの中身を確かめる
        run: |
          APP=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          lipo -archs "$APP/Contents/MacOS/vaultsweep"
          lipo -archs "$APP/Contents/MacOS/vaultsweep-mcp"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | "$APP/Contents/MacOS/vaultsweep-mcp" | head -c 300

      - uses: actions/upload-artifact@v7
        with:
          name: vaultsweep-mac
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: リリースに置く（タグのときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
