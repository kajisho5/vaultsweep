[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
url = "2.5.8"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "json", "charset"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
